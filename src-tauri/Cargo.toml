[package]
name = "contextdock"
version = "0.10.3"
description = "Local-first project document registry"
authors = ["ContextDock contributors"]
edition = "2021"

[lib]
name = "contextdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sha2 = "0.10"
notify = "8.2"
regex = "1"
serde_json = "1"
same-file = "1"
similar = "3.2.0"
quick-xml = "0.42.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"
